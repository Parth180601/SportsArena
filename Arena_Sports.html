    <style>
        * {

        }
        .header {
            display: flex;
            justify-content: space-between;

        }
        .right-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .right-buttons img {
            height: 40px;
        }
        .right-buttons button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .right-buttons button:hover {
            background: white;
            color: #0a0f2c;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        .auth-buttons a {
            color: white;

            padding: 8px 20px;
            border: 1px solid white;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .auth-buttons a:hover {
            background: white;
            color: #0a0f2c;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: black;
            font-size: 2em;
        }
        .slider {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .images {
            display: flex;
            width: 100%;
        }
        .images img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .images input {
            display: none;
        }
        .dots {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        .dots label {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dots label:hover {
            background: rgba(0, 0, 0, 0.6);
        }
        #img1:checked ~ .m1 {
            transform: translateX(0);
        }
        #img2:checked ~ .m2 {
            transform: translateX(-100%);
        }
        #img3:checked ~ .m3 {
            transform: translateX(-200%);
        }
        .info-section {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 40px;
        }
        .amenities, .rules {
            flex: 1;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .amenities h2, .rules h2 {
            color: black;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .amenities ul, .rules ul {
            list-style: none;
        }
        .amenities li, .rules li {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
            padding-left: 20px;
            position: relative;
        }
        .amenities li:before, .rules li:before {
            content: "•";
            color: black;
            position: absolute;
            left: 0;
        }
        .book-now {
            text-align: center;
            margin-top: 40px;
        }
        .book-button {
            display: inline-block;
            padding: 15px 40px;
            background: black;
            color: gold;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .book-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: #333;
        }

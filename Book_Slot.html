<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slots Booking</title>
    <link rel="stylesheet" href="Book_slot.css">
</head>
<body>
    <div class="slot_container">
        <label> Select Day </label>
        <select id="Days">
            <option value="850">Monday</option>
            <option value="850">Tuesday</option>
            <option value="850">Wednesday</option>
            <option value="850">Thursday</option>
            <option value="850">Friday</option>
            <option value="1000">Saturday</option>
            <option value="1100">Sunday</option>
        </select>
    </div>

    <ul class="showcase">
        <li>
            <div class="slot"></div>
            <small>Available</small>
        </li>
        <li>
            <div class="slot selected"></div>
            <small>selected</small>
        </li>
        <li>
            <div class="slot sold"></div>
            <small>sold</small>
        </li>
    </ul>>
    <div class="container">
        <div class="rows">
            <div class="slot">7</div>
            <div class="slot">8</div>
            <div class="slot">9</div>
            <div class="slot">10</div>
            <div class="slot sold">11</div>
            <div class="slot">12</div>
            <div class="slot">1</div>
        </div>
        <div class="rows">
            <div class="slot">2</div>
            <div class="slot">3</div>
            <div class="slot">4</div>
            <div class="slot sold">5</div>
            <div class="slot">6</div>
            <div class="slot sold">7</div>
            <div class="slot">8</div>
            <div class="slot">9</div>
            <div class="slot">10</div>
        </div>
    </div>
    <p class="text">
        You have selected <span id="count">0</span> slot for a price of Rs. <span id="total">0</span>
    </p>
    <h3>The slots begin from 7am to 10pm.<br> Each slot holds 1hr Booking.To book turf for 2hrs please select 2 slots.  </h3>
    <button type="submit" class="submit">submit</button>
    <script src="script.js"></script>
</body>
</html>
